name: CI - Shared Package

on:
    push:
        branches: [ main, master ]
        paths:
            - 'pkg/**'
            - '.github/workflows/ci-pkg.yml'
    pull_request:
        branches: [ main, master ]
        paths:
            - 'pkg/**'
            - '.github/workflows/ci-pkg.yml'
    # No nightly schedule: pull requests already run the whole (Go-only)
    # matrix, so a scheduled run would repeat them.
    workflow_dispatch:

# Superseded pull request runs are cancelled. Every other run gets a
# group of its own (the run ID), because GitHub cancels a *pending* run
# whenever a newer one joins its group, even with cancel-in-progress
# false, and pushes to main must each run to completion.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    pkg:
        name: Shared Package (Go ${{ matrix.go-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                go-version: ['1.26.11', '1.27.4']
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: false

            # The key ends in the commit SHA so that the build cache is
            # saved afresh after each run on main; an exact key hit is never
            # saved again, so a go.sum-only key froze the cache at the first
            # build for a given go.sum. Pull requests restore the newest
            # entry from main but never save, which keeps cache churn down.
            - name: Restore Go cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-pkg-${{ hashFiles('pkg/go.sum') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-go-${{ matrix.go-version }}-pkg-${{ hashFiles('pkg/go.sum') }}-
                      ${{ runner.os }}-go-${{ matrix.go-version }}-pkg-

            - name: Verify dependencies
              working-directory: pkg
              run: go mod verify

            - name: Download dependencies
              working-directory: pkg
              run: go mod download

            # A prebuilt binary of the latest release: CI deliberately
            # tracks the latest golangci-lint, and //nolint placement
            # depends on matching it.
            - name: Install golangci-lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: latest
                  install-only: true

            - name: Lint shared package code
              working-directory: pkg
              run: make lint

            - name: Run go vet
              working-directory: pkg
              run: go vet ./...

            - name: Check formatting
              working-directory: pkg
              run: |
                  gofmt -l . > /tmp/gofmt.out
                  if [ -s /tmp/gofmt.out ]; then
                    echo "The following files are not formatted:"
                    cat /tmp/gofmt.out
                    exit 1
                  fi

            - name: Run tests
              working-directory: pkg
              run: make test

            - name: Save Go cache
              if: github.event_name != 'pull_request'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-pkg-${{ hashFiles('pkg/go.sum') }}-${{ github.sha }}
