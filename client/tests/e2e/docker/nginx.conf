server {
    # Listen on an unprivileged port so nginx can run as the
    # non-root "nginx" user inside the container. The host-side
    # port mapping in docker-compose translates this back to the
    # operator-supplied CLIENT_PORT (default 3000).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Proxy API requests to the server container
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # E2E ONLY. AI analysis (agentic loops over /api/v1/llm/chat) and
        # the SSE overview stream can run well beyond nginx's 60s default,
        # which otherwise returns 504 to the browser mid-analysis and fails
        # the monitoring AI specs. This longer read timeout lives here, in
        # the e2e image's own nginx config, rather than in the production
        # docker/nginx.conf, so the test suite needs no product change.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy MCP requests to the server container
    location /mcp/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP may use server-sent events or streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy health check to the server container
    location = /health {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets with hashed filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files with SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
