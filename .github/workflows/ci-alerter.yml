name: CI - Alerter

on:
    push:
        branches: [ main, master ]
        paths:
            - 'alerter/**'
            - 'pkg/**'
            # The alerter tests read the collector's probe seed in
            # schema.go and parse the example and Docker configs.
            - 'collector/src/database/**'
            - 'examples/**'
            - 'docker/config/**'
            - '.github/workflows/ci-alerter.yml'
    pull_request:
        branches: [ main, master ]
        paths:
            - 'alerter/**'
            - 'pkg/**'
            # The alerter tests read the collector's probe seed in
            # schema.go and parse the example and Docker configs.
            - 'collector/src/database/**'
            - 'examples/**'
            - 'docker/config/**'
            - '.github/workflows/ci-alerter.yml'
    schedule:
        # Nightly full-matrix run (UTC).
        - cron: '37 2 * * *'
    workflow_dispatch:

# Superseded pull request runs are cancelled. Every other run gets a
# group of its own (the run ID), because GitHub cancels a *pending* run
# whenever a newer one joins its group, even with cancel-in-progress
# false, and pushes to main must each run to completion.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    alerter:
        name: Alerter (Go ${{ matrix.go-version }}, PG ${{ matrix.postgres-version }})
        runs-on: ubuntu-latest
        strategy:
            # Pull requests run two corners of the matrix: the oldest
            # supported Go against the newest PostgreSQL (the job that also
            # lints and uploads coverage), and the newest Go against the
            # oldest PostgreSQL. Pushes to main, the nightly schedule and
            # manual dispatches run the full cross product.
            matrix: >-
                ${{ fromJSON(github.event_name == 'pull_request'
                && '{"include":[{"go-version":"1.26.11","postgres-version":"18"},{"go-version":"1.27.4","postgres-version":"15"}]}'
                || '{"go-version":["1.26.11","1.27.4"],"postgres-version":["15","16","17","18"]}') }}
            fail-fast: false

        services:
            postgres:
                image: pgvector/pgvector:0.8.7-pg${{ matrix.postgres-version }}
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ matrix.go-version }}
                  cache: false

            # The key ends in the commit SHA so that the build cache is
            # saved afresh after each run on main; an exact key hit is never
            # saved again, so a go.sum-only key froze the cache at the first
            # build for a given go.sum. Pull requests restore the newest
            # entry from main but never save, which keeps cache churn down.
            - name: Restore Go cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-alerter-${{ hashFiles('alerter/src/go.sum') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-go-${{ matrix.go-version }}-alerter-${{ hashFiles('alerter/src/go.sum') }}-
                      ${{ runner.os }}-go-${{ matrix.go-version }}-alerter-

            - name: Verify dependencies
              working-directory: alerter/src
              run: go mod verify

            - name: Download dependencies
              working-directory: alerter/src
              run: go mod download

            # A prebuilt binary of the latest release: CI deliberately
            # tracks the latest golangci-lint, and //nolint placement
            # depends on matching it.
            - name: Install golangci-lint
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: latest
                  install-only: true

            - name: Lint alerter code
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              working-directory: alerter
              run: make lint

            - name: Run go vet
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              working-directory: alerter/src
              run: go vet ./...

            - name: Check formatting
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              working-directory: alerter
              run: |
                  gofmt -l ./src > /tmp/gofmt.out
                  if [ -s /tmp/gofmt.out ]; then
                    echo "The following files are not formatted:"
                    cat /tmp/gofmt.out
                    exit 1
                  fi

            - name: Build alerter
              working-directory: alerter
              run: make build

            - name: Verify binary
              run: |
                  ls -lh alerter/ai-dba-alerter
                  file alerter/ai-dba-alerter

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U postgres; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run tests with coverage
              working-directory: alerter
              env:
                  TEST_AI_WORKBENCH_SERVER: postgres://postgres:postgres@localhost:5432/postgres
              run: make coverage

            - name: Generate coverage report
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              working-directory: alerter/src
              run: |
                  go tool cover -func=coverage.out

            # Codacy's coverage reporter cannot parse Go's native cover
            # profile, so convert to lcov (which it does understand)
            # using gcov2lcov before uploading. Pinned to v1.1.1 for
            # reproducibility; see https://github.com/jandelgado/gcov2lcov/releases.
            # gcov2lcov resolves each package path in coverage.out via
            # `go list`, which requires running from inside the module
            # (where go.mod lives). alerter/src is the module root, so
            # we set working-directory there and use relative paths for
            # -infile/-outfile.
            - name: Convert coverage to lcov
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              working-directory: alerter/src
              run: |
                  go install github.com/jandelgado/gcov2lcov@v1.1.1
                  "$(go env GOPATH)/bin/gcov2lcov" -infile=coverage.out -outfile=coverage.lcov

            # Codacy multi-language coverage: upload as a partial here.
            # Finalization (the single `final` call) happens in the client
            # CI workflow after all language partials have been pushed.
            - name: Upload coverage to Codacy
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              env:
                  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
              run: |
                  bash <(curl -Ls https://coverage.codacy.com/get.sh) \
                    report \
                    --partial \
                    -l Go \
                    -r alerter/src/coverage.lcov

            - name: Upload build artifact
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ai-dba-alerter-linux-amd64
                  path: alerter/ai-dba-alerter
                  retention-days: 7

            - name: Upload coverage artifact
              if: matrix.go-version == '1.26.11' && matrix.postgres-version == '18'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: alerter-coverage
                  path: |
                      alerter/src/coverage.html
                      alerter/src/coverage.out
                  retention-days: 7

            - name: Save Go cache
              if: github.event_name != 'pull_request' && matrix.postgres-version == '18'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/go/pkg/mod
                      ~/.cache/go-build
                  key: ${{ runner.os }}-go-${{ matrix.go-version }}-alerter-${{ hashFiles('alerter/src/go.sum') }}-${{ github.sha }}
