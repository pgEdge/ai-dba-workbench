http:
  address: ":8080"
  tls:
    enabled: false
  auth:
    local:
      enabled: true

connection_security:
  allow_internal_networks: true
  # Absolute directory that connection SSL certificate, key and root
  # certificate files must be in; unset refuses every SSL file path
  # except ssl_root_cert_path "system". Read at start-up only.
  # ssl_cert_dir: "/etc/pgedge/certs"

database:
  host: postgres
  port: 5432
  database: ai_workbench
  user: postgres
  password: postgres
  sslmode: disable

secret_file: /etc/pgedge/ai-dba.secret
data_dir: /data
