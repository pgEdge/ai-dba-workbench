datastore:
    host: postgres
    database: ai_workbench
    username: postgres
    password_file: /etc/pgedge/secret/pg-password
    port: 5432
    sslmode: disable

pool:
    datastore_max_connections: 25
    max_connections_per_server: 3

# Directory that monitored connections' SSL certificate and key files
# must live in; when unset, a connection naming one is refused (except
# ssl_root_cert_path "system"). See examples/ai-dba-collector.yaml.
# connection_security:
#   ssl_cert_dir: /etc/pgedge/ai-dba-workbench/certs

secret_file: /etc/pgedge/secret/ai-dba.secret
