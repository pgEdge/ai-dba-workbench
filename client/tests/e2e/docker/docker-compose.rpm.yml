# pgEdge AI DBA Workbench - RPM Installation E2E Test Compose
#
# Starts the full test stack using an RPM-installed workbench instead of
# containers built from source. PostgreSQL, Mailpit, and WireMock are
# identical to docker-compose.yml.
#
# Quick start:
#
#   cd client/tests/e2e
#   POSTGRES_PASSWORD=postgres \
#   RPM_PLATFORM_IMAGE=rockylinux:9 \
#   REPO_CHANNEL=release \
#   docker compose -f docker/docker-compose.rpm.yml up -d --build
#

services:
  postgres:
    # RPM mode uses the pgEdge-packaged PostgreSQL image, which ships
    # system_stats (and pg_stat_statements) installed from the pgEdge RPM
    # repository for the SELECTED major version — the same distribution
    # used in production, and consistent with the RPM install path for the
    # workbench itself. Selecting a version is a matter of PG_MAJOR (the
    # image tag tracks it); the spec then does CREATE EXTENSION for
    # system_stats and pg_stat_statements on top. This is preferred over
    # compiling from source (as the Docker-mode image does). POSTGRES_IMAGE
    # still overrides the whole tag when needed.
    #
    # Supported PG_MAJOR values: 16, 17, 18 (default), and 19. PG 19 requires
    # the pgEdge image `pgedge-postgres:19-spock5-standard`, which is published
    # only after PostgreSQL 19 GA — until then `PG_MAJOR=19` fails at image
    # pull. Convenience scripts: `npm run test:rpm:pg18` / `test:rpm:pg19`.
    image: ${POSTGRES_IMAGE:-ghcr.io/pgedge/pgedge-postgres:${PG_MAJOR:-18}-spock5-standard}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ai_workbench
      # PGDATA tracks the selected version (RPM/pgEdge layout). Override
      # with PGDATA_DIR if the chosen image uses a different path.
      PGDATA: ${PGDATA_DIR:-/var/lib/pgsql/${PG_MAJOR:-18}/data}
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - e2e-network

  workbench:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rpm-installer
      args:
        BASE_IMAGE: ${RPM_PLATFORM_IMAGE:-rockylinux:9}
        REPO_CHANNEL: ${REPO_CHANNEL:-release}
        E2E_EMBEDDING_MODEL: ${E2E_EMBEDDING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      E2E_LLM_PROVIDER: ${E2E_LLM_PROVIDER:-}
      E2E_LLM_MODEL: ${E2E_LLM_MODEL:-}
      E2E_EMBEDDING_PROVIDER: ${E2E_EMBEDDING_PROVIDER:-}
      E2E_EMBEDDING_MODEL: ${E2E_EMBEDDING_MODEL:-}
    volumes:
      - workbench-data:/data
      - ${E2E_SECRET_DIR:-../secret}/llm_api_key:/etc/pgedge/llm_api_key:ro
      - ${E2E_SECRET_DIR:-../secret}/embedding_api_key:/etc/pgedge/embedding_api_key:ro
    ports:
      - "8080:8443"
      - "3000:8444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - e2e-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - e2e-network

  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "9090:8080"
    command: ["--global-response-templating", "--verbose"]
    networks:
      - e2e-network

volumes:
  workbench-data:

networks:
  e2e-network:
    driver: bridge
