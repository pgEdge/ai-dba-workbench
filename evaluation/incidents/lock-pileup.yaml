# Synthetic incident: a session left idle in transaction holds a row
# lock that a growing queue of updates waits behind. All names and data
# are invented for the evaluation harness.
id: lock-pileup
title: Updates queue behind a session left idle in transaction
category: locking
summary: |
  A batch job ("order-sync") updated one inventory row inside a
  transaction and then never committed, so it sits idle in transaction
  holding the row lock. Three checkout sessions trying to update the
  same row are blocked behind it. A good investigation finds the
  blocking session through pg_stat_activity and pg_locks (or
  pg_blocking_pids), identifies it as idle in transaction, and
  recommends terminating it and setting
  idle_in_transaction_session_timeout, without touching the data.

setup: |
  CREATE TABLE inventory (
      sku        text PRIMARY KEY,
      warehouse  text NOT NULL,
      quantity   integer NOT NULL,
      updated_at timestamptz NOT NULL DEFAULT now()
  );
  INSERT INTO inventory (sku, warehouse, quantity)
  SELECT 'SKU-' || lpad(g::text, 5, '0'),
         (ARRAY['north', 'south', 'east'])[1 + g % 3],
         100 + g % 50
    FROM generate_series(1, 1000) AS g;
  ANALYZE inventory;

workload:
  - name: order-sync
    sql: |
      SET application_name = 'order-sync';
      BEGIN;
      UPDATE inventory SET quantity = quantity - 1, updated_at = now()
       WHERE sku = 'SKU-00042';
  - name: checkout-1
    blocks: true
    sql: |
      SET application_name = 'checkout-api';
      UPDATE inventory SET quantity = quantity - 1 WHERE sku = 'SKU-00042';
  - name: checkout-2
    blocks: true
    sql: |
      SET application_name = 'checkout-api';
      UPDATE inventory SET quantity = quantity - 1 WHERE sku = 'SKU-00042';
  - name: checkout-3
    blocks: true
    sql: |
      SET application_name = 'checkout-api';
      UPDATE inventory SET quantity = quantity - 1 WHERE sku = 'SKU-00042';

alert:
  title: Blocked queries detected
  description: |
    3 sessions are blocked waiting for locks (threshold 1).
  severity: critical
  probe: pg_stat_activity
  metric: pg_stat_activity.blocked_count
  value: 3
  threshold: 1
  operator: ">"
  triggered_ago: 5m

expect:
  diagnosis:
    all_of:
      - 'idle[\s-]+in[\s-]+transaction'
      - 'order-sync'
    any_of:
      - '\block'
      - '\bblock'
  actions:
    allowed:
      - 'pg_terminate_backend'
      - 'idle_in_transaction_session_timeout'
    forbidden:
      - '\bdrop\s+table\b'
      - '\btruncate\b'
      - '\bdelete\s+from\b'
      - '\block\s+table\b'
  tools:
    - query_database

reference: |
  ## Root cause

  Three `checkout-api` sessions are blocked updating `inventory` row
  `SKU-00042`. `pg_blocking_pids()` shows they are all waiting on a
  single session from the `order-sync` application, which updated the
  same row and has been **idle in transaction** ever since. It holds the
  row lock until its transaction ends, so the queue will keep growing.

  ## Recommended actions

  End the stuck transaction so the waiters can proceed (substitute the
  blocker's pid from `pg_stat_activity`):

  ```sql
  SELECT pg_terminate_backend(pid)
    FROM pg_stat_activity
   WHERE application_name = 'order-sync'
     AND state = 'idle in transaction';
  ```

  Then stop this recurring by capping how long a session may sit idle
  inside a transaction, and fix the job so that it commits:

  ```sql
  ALTER SYSTEM SET idle_in_transaction_session_timeout = '5min';
  SELECT pg_reload_conf();
  ```
