datastore:
  host: postgres
  database: ai_workbench
  username: postgres
  password_file: /etc/pgedge/pg-password
  port: 5432
  sslmode: disable

pool:
  datastore_max_connections: 25
  max_connections_per_server: 3
  # Seconds an idle datastore connection is kept before being closed.
  datastore_max_idle_seconds: 300
  # Max seconds to wait to acquire a datastore connection.
  datastore_max_wait_seconds: 60
  # Seconds an idle monitored-server connection is kept before closing.
  monitored_max_idle_seconds: 300
  # Per-probe execution timeout (seconds) for monitored servers; raise
  # this for large or slow monitored databases where probes such as
  # pg_stat_statements can take longer to complete.
  monitored_max_wait_seconds: 120

scheduler:
  # Maximum probe executions running concurrently across all monitored
  # connections.
  max_concurrent_probes: 8
  # Maximum of those concurrent executions a single monitored connection
  # may hold at once, so one slow server cannot occupy every slot and
  # queue healthy connections behind it. Clamped to max_concurrent_probes.
  max_concurrent_probes_per_connection: 2
  # Upper bound (seconds) on the random delay applied before the first
  # execution of a probe that is past due, has never run, or whose last
  # collection time could not be determined, so a restart does not fire
  # every probe at once. Zero disables the jitter.
  startup_jitter_seconds: 60

secret_file: /etc/pgedge/ai-dba.secret
